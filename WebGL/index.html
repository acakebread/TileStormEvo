<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | TileStormEvolution</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      #unity-fullscreen-button {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 8px 12px;
        border: 0;
        border-radius: 4px;
        background: rgba(0,0,0,.65);
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1200 height=800 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <button id="unity-fullscreen-button" type="button">[ ]</button>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js").catch((error) => {
            console.warn("Service worker registration failed; continuing without offline cache.", error);
          });
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var unityInstance = null;
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      fullscreenButton.onclick = () => {
        if (unityInstance) unityInstance.SetFullscreen(1);
        else canvas.requestFullscreen?.();
      };

      var version = "0.1.10";
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/f1233ce390d6c9bed236da1acd9264a5.loader.js?v=" + version;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/1a53b9c708b733146a013f454d15214c.data.unityweb?v=" + version,
        frameworkUrl: buildUrl + "/9462e4a252b86de52013a07024adf5fd.framework.js.unityweb?v=" + version,
        codeUrl: buildUrl + "/1a8c26e744cc470bebd10d7f2de4f461.wasm.unityweb?v=" + version,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MassiveHadron",
        productName: "TileStormEvolution",
        productVersion: "0.1.10",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
