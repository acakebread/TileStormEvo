<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | TileStormEvolution</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <script>
      window.TileStormAnalytics = (() => {
        const pending = [];
        let retryCount = 0;
        let retryTimer = null;

        function flush() {
          retryTimer = null;
          if (window.goatcounter && typeof window.goatcounter.count === "function") {
            while (pending.length > 0) {
              window.goatcounter.count(pending.shift());
            }
            return;
          }

          if (pending.length > 0 && retryCount++ < 120) {
            retryTimer = window.setTimeout(flush, 250);
          }
        }

        return {
          track(path, title, alwaysCount = true) {
            if (!path) {
              return;
            }

            pending.push({
              path: String(path),
              title: String(title || path),
              event: true,
              no_session: Boolean(alwaysCount)
            });

            if (!retryTimer) {
              flush();
            }
          }
        };
      })();
    </script>
    <script data-goatcounter="https://acakebread.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <style>
      #unity-fullscreen-button {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 8px 12px;
        border: 0;
        border-radius: 4px;
        background: rgba(0,0,0,.65);
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1200 height=800 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <button id="unity-fullscreen-button" type="button">[ ]</button>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js").catch((error) => {
            console.warn("Service worker registration failed; continuing without offline cache.", error);
          });
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var unityInstance = null;
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      fullscreenButton.onclick = () => {
        if (unityInstance) unityInstance.SetFullscreen(1);
        else canvas.requestFullscreen?.();
      };

      var version = "0.1.36";
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ab6885b844cd6f3e4219cb5ce21234c3.loader.js?v=" + version;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/df7c789f4e338e973920f3f2f10ffdfb.data.unityweb?v=" + version,
        frameworkUrl: buildUrl + "/be7e575341433d559970f22e3296ae1a.framework.js.unityweb?v=" + version,
        codeUrl: buildUrl + "/cef899bd03d4b6adb07461523cce8a0d.wasm.unityweb?v=" + version,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MassiveHadron",
        productName: "TileStormEvolution",
        productVersion: "0.1.36",
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          window.TileStormAnalytics.track("webgl-ready", "TileStorm WebGL runtime ready", true);
        }).catch((message) => {
          window.TileStormAnalytics.track("webgl-load-failed", "TileStorm WebGL runtime failed", true);
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
