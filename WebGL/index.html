<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
    <title>Unity Web Player | TileStormEvolution</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <script>
      window.TileStormAnalytics = (() => {
        const pending = [];
        let retryCount = 0;
        let retryTimer = null;

        function flush() {
          retryTimer = null;
          if (window.goatcounter && typeof window.goatcounter.count === "function") {
            while (pending.length > 0) {
              window.goatcounter.count(pending.shift());
            }
            return;
          }

          if (pending.length > 0 && retryCount++ < 120) {
            retryTimer = window.setTimeout(flush, 250);
          }
        }

        return {
          track(path, title, alwaysCount = true) {
            if (!path) {
              return;
            }

            pending.push({
              path: String(path),
              title: String(title || path),
              event: true,
              no_session: Boolean(alwaysCount)
            });

            if (!retryTimer) {
              flush();
            }
          }
        };
      })();
    </script>
    <script data-goatcounter="https://acakebread.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <style>
      #unity-fullscreen-button {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        min-width: 44px;
        min-height: 44px;
        padding: 8px 12px;
        border: 0;
        border-radius: 4px;
        background: rgba(0,0,0,.65);
        color: white;
        font-size: 18px;
        cursor: pointer;
        touch-action: manipulation;
      }
      @media (pointer: coarse) {
        #unity-fullscreen-button {
          right: 16px;
          bottom: 16px;
          min-width: 56px;
          min-height: 56px;
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1200 height=800 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <button id="unity-fullscreen-button" type="button">[ ]</button>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js").catch((error) => {
            console.warn("Service worker registration failed; continuing without offline cache.", error);
          });
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var unityInstance = null;
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var mobileExpanded = false;

      function isIOS() {
        return /iPhone|iPad|iPod/i.test(navigator.userAgent)
          || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      }

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function updateFullscreenButton() {
        var active = Boolean(fullscreenElement()) || mobileExpanded;
        fullscreenButton.textContent = active ? "X" : "[ ]";
        fullscreenButton.setAttribute("aria-label", active ? "Exit full screen" : "Full screen");
      }

      function setMobileExpanded(expanded) {
        mobileExpanded = expanded;
        document.documentElement.classList.toggle("mobile-expanded", expanded);
        window.setTimeout(function () {
          window.scrollTo(0, expanded ? 1 : 0);
        }, 50);
        updateFullscreenButton();
      }

      function enterFullscreen() {
        var request = container.requestFullscreen || container.webkitRequestFullscreen;
        if (!request) {
          setMobileExpanded(true);
          return;
        }

        Promise.resolve(request.call(container)).catch(function () {
          setMobileExpanded(true);
        });
      }

      function exitFullscreen() {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (fullscreenElement() && exit) {
          Promise.resolve(exit.call(document)).catch(function () {});
        }
        setMobileExpanded(false);
      }

      fullscreenButton.onclick = function () {
        var active = Boolean(fullscreenElement()) || mobileExpanded;
        if (unityInstance && !isIOS()) {
          unityInstance.SetFullscreen(active ? 0 : 1);
          return;
        }

        if (active) exitFullscreen();
        else enterFullscreen();
      };

      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
      updateFullscreenButton();

      var version = "0.1.111";
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/fcc10c9b8c396b7dcf43907ecb4a92b0.loader.js?v=" + version;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/07dccaa12a4c2c0945adccbe1141b420.data.unityweb?v=" + version,
        frameworkUrl: buildUrl + "/8cc69edc7e0fd18486a97f41b44852e7.framework.js.unityweb?v=" + version,
        codeUrl: buildUrl + "/e317290a595b823ac12bd81f5b137bf4.wasm.unityweb?v=" + version,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MassiveHadron",
        productName: "TileStormEvolution",
        productVersion: "0.1.111",
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          window.TileStormAnalytics.track("webgl-ready", "TileStorm WebGL runtime ready", true);
        }).catch((message) => {
          window.TileStormAnalytics.track("webgl-load-failed", "TileStorm WebGL runtime failed", true);
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
